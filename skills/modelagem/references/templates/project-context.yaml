# O que se sabe sobre o software e sobre a documentacao.
#
# Este arquivo existe para que uma sessao nova consiga interpretar corretamente
# os pedidos do arquiteto: o que esta sendo documentado, para que, para quem, com
# que vocabulario, e o que ainda nao se sabe.
#
# Ele guarda FATOS E DECISOES DELE. Nao guarda raciocinio seu: nao ha estrategia
# recomendada, alternativas, trade-offs, perfil de processo nem plano de ondas.
#
# Grave o que a conversa TOCOU. Campo que ninguem conversou fica ausente —
# preencher tudo com `unknown` produz um documento que parece completo e nao e.
#
# status, em todo item:
#   fact      o arquiteto afirmou
#   evidence  voce leu no repositorio, e ele ainda nao confirmou
#   unknown   perguntou-se, e nao se sabe (divida declarada)
version: 2
updated: AAAA-MM-DD

# ---------------------------------------------------------------------------
# Objetivo da documentacao — por que estes diagramas existem
# ---------------------------------------------------------------------------
objetivo:
  porque: |
    Por que a documentacao esta sendo feita, na voz de quem pediu.
  explicar: |
    O que o arquiteto quer que o desenho explique.
  estado: null         # atual | transicao | alvo | outro — so quando houver mais de um
  status: unknown

# ---------------------------------------------------------------------------
# Audiencias — quem consome os diagramas
# ---------------------------------------------------------------------------
audiences:
  - who: quem e
    precisa_responder:
      - ...
    status: fact

# ---------------------------------------------------------------------------
# Escopo — o que o arquiteto disse que esta dentro, fora, ou so como contexto
# ---------------------------------------------------------------------------
scope:
  inside: []
  outside: []
  context_only: []
  status: unknown

# ---------------------------------------------------------------------------
# O sistema — o que esta sendo documentado, em prosa curta
# ---------------------------------------------------------------------------
sistema:
  o_que_e: |
    Produto, plataforma, sistema ou conjunto de sistemas.
  problema_de_negocio: |
    Que problema ele resolve.
  atores: []           # usuarios e papeis, nas palavras da organizacao
  capacidades: []
  sistemas_externos: []
  status: unknown

# ---------------------------------------------------------------------------
# Tecnologias e infraestrutura relatadas ou observadas
# ---------------------------------------------------------------------------
tecnologias:
  - nome: ...
    onde: ...          # em que aplicacao ou integracao aparece
    status: evidence
    fonte: repo        # arquiteto | repo

# ---------------------------------------------------------------------------
# Elementos conhecidos — o que se sabe que EXISTE.
#
# Saber que existe NAO diz como sera representado: abstracao C4, `parent` e
# nivel sao decisao do arquiteto. Enquanto ele nao disser, a linha fica aqui e
# NAO vira caixa.
# ---------------------------------------------------------------------------
elementos_conhecidos:
  - nome: ...
    o_que_se_sabe: |
      O que foi dito sobre ele: como roda, o que faz, com quem fala.
    representacao: null    # o id no modelo, quando o arquiteto ja tiver decidido
    status: fact

# ---------------------------------------------------------------------------
# Fontes consultadas — o que foi lido para chegar aqui
# ---------------------------------------------------------------------------
fontes:
  - o_que: README do repositorio
    quando: AAAA-MM-DD
    o_que_respondeu: |
      ...

# ---------------------------------------------------------------------------
# Glossario — nasce assim que um termo aparecer com mais de um sentido
# ---------------------------------------------------------------------------
glossary:
  termo: o que ele significa NESTA iniciativa

# ---------------------------------------------------------------------------
# Duvidas abertas — sem alvo no modelo. Duvida sobre uma caixa que ja existe
# nao vem para ca: vira uma nota `question` presa aquela caixa.
# ---------------------------------------------------------------------------
questions:
  - id: Q-001
    pergunta: ...
    trava: o que nao anda enquanto isso estiver aberto
    perguntada_em: AAAA-MM-DD
    status: open       # open | answered
    resposta: null
