# Os contratos, em todo push e todo pull request.
#
# Não há build nem lint: o repositório inteiro é prosa. O que se pode verificar
# automaticamente é se a prosa se refere a arquivos que existem, se os nomes
# batem, e se não sobrou resíduo da substituição mecânica — que é exatamente o
# que `scripts/verificar.mjs` faz.
#
# O que ele NÃO alcança é o comportamento: se o plugin realmente pergunta em vez
# de decidir, isso só se mede conversando com ele. O que dá para afirmar aqui é
# que nenhuma regra prescritiva voltou por escrito, que a CLI continua sendo a
# fonte, e que a prosa se refere a arquivos que existem.
name: verificação

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: contratos
        run: node --test scripts/verificar.mjs
